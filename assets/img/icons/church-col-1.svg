<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#2e76ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="1000" rx="24" fill="#0b0b0b"/>
  <!-- Steeple base -->
  <rect x="230" y="540" width="340" height="260" rx="18" fill="#111" stroke="#2a2a2a"/>
  <!-- Door -->
  <rect x="380" y="650" width="80" height="150" rx="12" fill="#181818" stroke="#3a3a3a"/>
  <!-- Roof -->
  <polygon points="400,300 650,540 150,540" fill="#131313" stroke="#2a2a2a"/>
  <!-- Cross -->
  <rect x="380" y="210" width="40" height="180" rx="8" fill="#fff"/>
  <rect x="330" y="260" width="140" height="40" rx="8" fill="#fff"/>
  <!-- Accent glow behind cross -->
  <circle cx="400" cy="260" r="120" fill="url(#accent)" opacity="0.25" filter="url(#softGlow)"/>
  <!-- Caption -->
  <text x="50%" y="920" fill="#c9c9c9" font-family="Inter, system-ui, -apple-system" font-size="28" text-anchor="middle">Steeple & Cross</text>
</svg>