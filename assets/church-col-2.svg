<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#2e76ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0b0b0b"/>
  <!-- Stained glass arcs -->
  <g opacity="0.9">
    <circle cx="340" cy="460" r="220" fill="url(#glassGrad)"/>
    <circle cx="540" cy="400" r="180" fill="#ff6b6b" opacity="0.6"/>
    <circle cx="720" cy="520" r="160" fill="#ffd166" opacity="0.55"/>
    <circle cx="980" cy="420" r="200" fill="#06d6a0" opacity="0.55"/>
    <circle cx="1240" cy="520" r="180" fill="#118ab2" opacity="0.55"/>
  </g>
  <!-- Frame lines -->
  <rect x="90" y="120" width="1420" height="660" rx="20" fill="none" stroke="#2a2a2a" stroke-width="4"/>
  <text x="50%" y="860" fill="#c9c9c9" font-family="Inter, system-ui, -apple-system" font-size="28" text-anchor="middle">Stained Glass Study</text>
</svg>